[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
    "tests/*",
    "test_*.py",
    "setup.py",
    "conftest.py",
    "app/__init__.py",
    "models/__init__.py",
    "repositories/__init__.py",
    "services/__init__.py",
    "tests/integration/__init__.py",
    "docs/*"
]
